<h2>DATOS DEL PEDIDO</h2>

<h4 class="labelCosto">Costo total: {{ costoTotal | currency:'COP':'symbol':'1.0-0'  }}</h4>
<form [formGroup]="form">
    <div class="row">
        <div class="col-sm-6 mb-3 mb-sm-0">
            <label><input type="checkbox" formControlName="checkDomicilio" />Es domicilio</label>
        </div>
        @if (!form.controls.checkDomicilio.value) {
        <div class="col-sm-6">
            <label for="tentacles">Mesa no:</label>
            <input type="number" id="mesa" name="mesa" min="1" max="30" formControlName="mesa" />
        </div>
        }
    </div>
    <div class="row">
        <div class="col-sm-6 mb-3 mb-sm-0">
            <label for="floatingTextarea">Comentarios</label>
            <textarea class="form-control" placeholder="Comentarios adicionales"
                formControlName="comentarios"></textarea>
        </div>
    </div>
</form>

<br>

<div class="container">
    <div class="title">
        <h4>COMIDA</h4>
        <button class="btn btn-primary btn-sm bi bi-plus-circle" (click)="agregarComida()"></button>
    </div>
    <div class="content">
        @for(comida of listaComidas; track comida.index) {
        <div class="card">
            <app-producto-crear [productos]="productos" [acompanamientos]="acompanamientos" [index]="comida.index"
                (onProductoSet)="onComidaSet($event)"></app-producto-crear>
            <button class="btn btn-primary bi bi-x-circle-fill remove" (click)="borrarComida(comida)"></button>
        </div>
        }
    </div>
</div>

<div class="container">
    <div class="title">
        <h4>BEBIDAS</h4>
        <button class="btn btn-primary btn-sm bi bi-plus-circle" (click)="agregarBebida()"></button>
    </div>
    <div class="content">
        @for(bebida of listaBebidas; track bebida.index) {
        <div class="card">
            <app-producto-crear [productos]="bebidas" [index]="bebida.index"
    (onProductoSet)="onBebidaSet($event)"></app-producto-crear>
            <button class="btn btn-primary bi bi-x-circle-fill remove" (click)="borrarBebida(bebida)"></button>
        </div>
        }
    </div>
</div>

<button class="btn btn-primary" (click)="crearPedido()">Crear Pedido</button>
